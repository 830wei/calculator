<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>財務規劃與套利試算器</title>
  <style>
    :root {
      --bg-color: #f7f5f0;
      --card-bg: #fefdfb;
      --card-border: #e8e3d9;
      --text-main: #333333;
      --text-muted: #777777;
      --accent-brown: #bc6c4c;
      
      --dash-bg: #40444e;
      --dash-card-bg: #323641;
      --dash-title-red: #ff6b6b;
      --green-text: #2ecc71;
      --red-text: #ff6b6b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 30px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 800px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 上方米白色輸入卡片 */
    .input-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px 24px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #2b2b2b;
    }

    .toggle-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: #666;
    }

    /* Switch 開關 */
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #dcd8d0;
      transition: .3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent-brown);
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 12px;
    }

    .form-grid:last-child {
      margin-bottom: 0;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #e2ded6;
      border-radius: 10px;
      font-size: 0.95rem;
      background-color: #fff;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--accent-brown);
    }

    /* 下方深色儀表板 */
    .dashboard {
      background-color: var(--dash-bg);
      border-radius: 16px;
      padding: 24px 28px;
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }

    .dash-header-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 20px;
      border-left: 4px solid var(--dash-title-red);
      padding-left: 10px;
      line-height: 1.2;
    }

    .dash-top-grid {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    .dash-left-stats {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 10px;
    }
    
    .stat-row:last-child {
      border-bottom: none;
    }

    .stat-label {
      font-size: 0.95rem;
      color: #aeb4c0;
    }

    .stat-label sub {
      font-size: 0.75rem;
      opacity: 0.8;
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 700;
    }

    .text-green { color: var(--green-text); }
    .text-red { color: var(--red-text); }
    .text-white { color: #ffffff; }

    /* 右側配息覆蓋率卡片 */
    .coverage-box {
      background-color: var(--dash-card-bg);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .cov-title {
      font-size: 0.95rem;
      color: #aeb4c0;
      margin-bottom: 12px;
    }

    .cov-num {
      font-size: 2.8rem;
      font-weight: 800;
      color: var(--red-text);
    }

    /* 下方四個小指標 */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .metric-card {
      background-color: var(--dash-card-bg);
      border-radius: 12px;
      padding: 20px 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .m-title {
      font-size: 0.85rem;
      color: #aeb4c0;
      margin-bottom: 12px;
    }

    .m-value {
      font-size: 1.35rem;
      font-weight: 700;
    }

    .m-sub {
      font-size: 0.75rem;
      color: #838996;
      margin-top: 6px;
    }

    @media (max-width: 640px) {
      .form-grid, .dash-top-grid {
        grid-template-columns: 1fr;
      }
      .metrics-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- 1. 信用貸款 -->
  <div class="input-card">
    <div class="card-header">
      <div class="card-title">☕ 信用貸款</div>
      <div class="toggle-group">
        <label class="switch">
          <input type="checkbox" id="creditInvest" checked>
          <span class="slider"></span>
        </label>
        投入市場
      </div>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>貸款銀行</label>
        <input type="text" id="creditBank" value="line bank">
      </div>
      <div class="form-group">
        <label>信貸金額 (NT$)</label>
        <input type="text" id="creditAmount" value="1,000,000" oninput="formatInput(this)">
      </div>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>年利率 (%)</label>
        <input type="number" id="creditRate" step="0.1" value="4.8">
      </div>
      <div class="form-group">
        <label>年限 (年)</label>
        <input type="number" id="creditYears" value="10">
      </div>
    </div>
  </div>

  <!-- 2. 保單貸款 -->
  <div class="input-card">
    <div class="card-header">
      <div class="card-title">📄 保單貸款</div>
      <div class="toggle-group">
        <label class="switch">
          <input type="checkbox" id="policyInvest">
          <span class="slider"></span>
        </label>
        投入市場
      </div>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>保險公司名稱</label>
        <input type="text" id="policyCompany" value="公勝人壽">
      </div>
      <div class="form-group">
        <label>保貸金額 (NT$)</label>
        <input type="text" id="policyAmount" value="0" oninput="formatInput(this)">
      </div>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>利率 (%)</label>
        <input type="number" id="policyRate" step="0.1" value="4.0">
      </div>
      <div class="form-group"></div>
    </div>
  </div>

  <!-- 3. 自有資金 -->
  <div class="input-card">
    <div class="card-header">
      <div class="card-title">🐖 自有資金</div>
      <div class="toggle-group">
        <label class="switch">
          <input type="checkbox" id="ownInvest" checked>
          <span class="slider"></span>
        </label>
        投入市場
      </div>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>自有現金金額 (NT$)</label>
        <input type="text" id="ownAmount" value="500,000" oninput="formatInput(this)">
      </div>
      <div class="form-group">
        <label>預估投資年化配息率 (%)</label>
        <input type="number" id="yieldRate" step="0.1" value="8.8">
      </div>
    </div>
  </div>

  <!-- 4. 規劃成果總計 -->
  <div class="dashboard">
    <div class="dash-header-title">規劃成果總計</div>

    <div class="dash-top-grid">
      <div class="dash-left-stats">
        <div class="stat-row">
          <div class="stat-label">總投入市場資產</div>
          <div class="stat-value text-white" id="totalAsset">NT$1,500,000</div>
        </div>
        <div class="stat-row">
          <div class="stat-label">每月預估現金流 <sub>(配息)</sub></div>
          <div class="stat-value text-green" id="monthlyDividend">+NT$11,000</div>
        </div>
        <div class="stat-row">
          <div class="stat-label">每月貸款總支出</div>
          <div class="stat-value text-red" id="monthlyLoanPay">-NT$10,510</div>
        </div>
      </div>

      <div class="coverage-box">
        <div class="cov-title">配息覆蓋率<br><sub>(配息 / 貸款支出)</sub></div>
        <div class="cov-num" id="coverageRate">104.7%</div>
      </div>
    </div>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="m-title">每月淨現金流</div>
        <div class="m-value text-green" id="netMonthlyFlow">NT$+490</div>
      </div>

      <div class="metric-card">
        <div class="m-title">財務減壓評估</div>
        <div class="m-value text-green" id="stressStatus">已達成</div>
      </div>

      <div class="metric-card">
        <div class="m-title">年度配息總計</div>
        <div class="m-value text-green" id="annualDividend">+NT$132,000</div>
        <div class="m-sub">(預估年收)</div>
      </div>

      <div class="metric-card">
        <div class="m-title">年度淨現金流</div>
        <div class="m-value text-green" id="netAnnualFlow">NT$+5,880</div>
      </div>
    </div>
  </div>

</div>

<script>
  // 千分位格式化功能
  function formatInput(input) {
    let val = input.value.replace(/,/g, '').replace(/[^0-9]/g, '');
    if (val === '') {
      input.value = '0';
    } else {
      input.value = parseInt(val, 10).toLocaleString('en-US');
    }
  }

  // 取得去除千分位的純數字
  function getNum(id) {
    const el = document.getElementById(id);
    if (!el) return 0;
    const val = parseFloat(el.value.replace(/,/g, ''));
    return isNaN(val) ? 0 : val;
  }

  // 標準等額本息攤還公式 (PMT)
  function calculatePMT(principal, annualRate, years) {
    if (principal <= 0 || annualRate <= 0 || years <= 0) return 0;
    const monthlyRate = (annualRate / 100) / 12; // 年利率轉月利率
    const totalPayments = years * 12; // 總期數
    return principal * (monthlyRate * Math.pow(1 + monthlyRate, totalPayments)) / (Math.pow(1 + monthlyRate, totalPayments) - 1);
  }

  function updateCalculations() {
    // 1. 信貸計算 (本息攤還)
    const creditAmount = getNum('creditAmount');
    const creditRate = getNum('creditRate');
    const creditYears = getNum('creditYears');
    const creditPay = calculatePMT(creditAmount, creditRate, creditYears);

    // 2. 保貸計算 (一般為只繳息不還本)
    const policyAmount = getNum('policyAmount');
    const policyRate = getNum('policyRate');
    const policyPay = (policyAmount * (policyRate / 100)) / 12;

    const totalLoanPay = creditPay + policyPay;

    // 3. 投入市場資產加總
    let totalInvested = 0;
    if (document.getElementById('creditInvest').checked) totalInvested += creditAmount;
    if (document.getElementById('policyInvest').checked) totalInvested += policyAmount;
    if (document.getElementById('ownInvest').checked) totalInvested += getNum('ownAmount');

    // 4. 預估配息
    const yieldRate = getNum('yieldRate');
    const annualDiv = totalInvested * (yieldRate / 100);
    const monthlyDiv = annualDiv / 12;

    // 5. 淨流與覆蓋率
    const netMonthly = monthlyDiv - totalLoanPay;
    const netAnnual = annualDiv - (totalLoanPay * 12);
    
    let coverage = 0;
    if (totalLoanPay > 0) {
      coverage = (monthlyDiv / totalLoanPay) * 100;
    } else if (monthlyDiv > 0 && totalLoanPay === 0) {
      coverage = 999; // 代表無負債且有收入
    }

    // --- UI 渲染更新 ---
    const fmt = num => Math.round(num).toLocaleString('en-US');
    const fmtSign = num => (num >= 0 ? '+NT$' : '-NT$') + fmt(Math.abs(num));

    document.getElementById('totalAsset').innerText = `NT$${fmt(totalInvested)}`;
    document.getElementById('monthlyDividend').innerText = `+NT$${fmt(monthlyDiv)}`;
    document.getElementById('monthlyLoanPay').innerText = `-NT$${fmt(totalLoanPay)}`;

    const covEl = document.getElementById('coverageRate');
    covEl.innerText = coverage === 999 ? '∞%' : `${coverage.toFixed(1)}%`;
    covEl.style.color = coverage >= 100 ? 'var(--green-text)' : 'var(--red-text)';

    // 每月淨現金流
    const netMEl = document.getElementById('netMonthlyFlow');
    netMEl.innerText = fmtSign(netMonthly);
    netMEl.className = `m-value ${netMonthly >= 0 ? 'text-green' : 'text-red'}`;

    // 減壓評估
    const stressEl = document.getElementById('stressStatus');
    stressEl.innerText = netMonthly >= 0 ? '已達成' : '未達成';
    stressEl.className = `m-value ${netMonthly >= 0 ? 'text-green' : 'text-red'}`;

    // 年度數據
    document.getElementById('annualDividend').innerText = `+NT$${fmt(annualDiv)}`;
    const netAEl = document.getElementById('netAnnualFlow');
    netAEl.innerText = fmtSign(netAnnual);
    netAEl.className = `m-value ${netAnnual >= 0 ? 'text-green' : 'text-red'}`;
  }

  // 監聽所有輸入變動
  document.querySelectorAll('input').forEach(input => {
    input.addEventListener('input', updateCalculations);
    input.addEventListener('change', updateCalculations);
  });

  // 初始執行一次
  updateCalculations();
</script>

</body>
</html>
