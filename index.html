<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>貸款與投資試算器</title>
  <style>
    :root {
      --bg-color: #f8f6f0;
      --card-bg: #ffffff;
      --dark-card: #2c323f;
      --text-main: #333333;
      --text-muted: #888888;
      --green: #2ecc71;
      --red: #e74c3c;
      --accent: #d35400;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 800px;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 10px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 0.9rem;
      color: #666;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px;
      border: 1fr solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1rem;
    }

    /* Toggle Switch Style */
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #c06c47;
    }

    input:checked + .slider:before {
      transform: translateX(24px);
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: #666;
    }

    /* Dark Summary Section */
    .dashboard {
      background-color: var(--dark-card);
      color: #fff;
      border-radius: 12px;
      padding: 24px;
    }

    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 25px;
    }

    .big-num {
      font-size: 1.8rem;
      font-weight: bold;
    }

    .text-green { color: var(--green); }
    .text-red { color: var(--red); }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
    }

    .metric-card {
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }

    .metric-title {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 8px;
    }

    .metric-value {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .sub-text {
      font-size: 0.75rem;
      color: #888;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- 1. 信用貸款 -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">☕ 信用貸款</div>
      <div class="toggle-label">
        <label class="switch">
          <input type="checkbox" id="creditInvest" checked>
          <span class="slider"></span>
        </label>
        投入市場
      </div>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label>貸款銀行</label>
        <input type="text" value="Line Bank">
      </div>
      <div class="form-group">
        <label>信貸金額 (NT$)</label>
        <input type="number" id="creditAmount" value="1000000">
      </div>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label>年利率 (%)</label>
        <input type="number" id="creditRate" step="0.1" value="4.8">
      </div>
      <div class="form-group">
        <label>年限 (年)</label>
        <input type="number" id="creditYears" value="10">
      </div>
    </div>
  </div>

  <!-- 2. 保單貸款 -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">📄 保單貸款</div>
      <div class="toggle-label">
        <label class="switch">
          <input type="checkbox" id="policyInvest">
          <span class="slider"></span>
        </label>
        投入市場
      </div>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label>保險公司名稱</label>
        <input type="text" value="公勝人壽">
      </div>
      <div class="form-group">
        <label>保貸金額 (NT$)</label>
        <input type="number" id="policyAmount" value="0">
      </div>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label>利率 (%)</label>
        <input type="number" id="policyRate" step="0.1" placeholder="0">
      </div>
    </div>
  </div>

  <!-- 3. 自有資金與預估殖利率 -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">🐖 自有資金與投資預估</div>
      <div class="toggle-label">
        <label class="switch">
          <input type="checkbox" id="ownInvest" checked>
          <span class="slider"></span>
        </label>
        投入市場
      </div>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label>自有現金金額 (NT$)</label>
        <input type="number" id="ownAmount" value="500000">
      </div>
      <div class="form-group">
        <label>預估投資年化配息率 (%)</label>
        <input type="number" id="yieldRate" step="0.1" value="8.8">
      </div>
    </div>
  </div>

  <!-- 4. 規劃成果總計 -->
  <div class="dashboard">
    <div style="font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; border-left: 4px solid #c06c47; padding-left: 10px;">
      規劃成果總計
    </div>
    
    <div class="dash-header">
      <div>
        <div style="color: #aaa; font-size: 0.9rem;">總投入市場資產</div>
        <div class="big-num" id="totalAsset">NT$ 0</div>
        
        <div style="color: #aaa; font-size: 0.9rem; margin-top: 10px;">每月預估現金流 (配息)</div>
        <div class="big-num text-green" id="monthlyDividend">+NT$ 0</div>
        
        <div style="color: #aaa; font-size: 0.9rem; margin-top: 10px;">每月貸款總支出</div>
        <div class="big-num text-red" id="monthlyLoanPay">-NT$ 0</div>
      </div>

      <div style="background: rgba(255,255,255,0.08); padding: 20px; border-radius: 10px; text-align: right; min-width: 180px;">
        <div style="color: #aaa; font-size: 0.85rem;">配息覆蓋率 (配息 / 貸款支出)</div>
        <div style="font-size: 2rem; font-weight: bold; color: #ff7675; margin-top: 10px;" id="coverageRate">0.0%</div>
      </div>
    </div>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-title">每月淨現金流</div>
        <div class="metric-value" id="netMonthlyFlow">NT$ 0</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">財務減壓評估</div>
        <div class="metric-value" id="stressStatus">未達成</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">年度配息總計 (預估年收)</div>
        <div class="metric-value text-green" id="annualDividend">+NT$ 0</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">年度淨現金流</div>
        <div class="metric-value" id="netAnnualFlow">NT$ 0</div>
      </div>
    </div>
  </div>

</div>

<script>
  // 計算本息平均攤還 (PMT)
  function calculatePMT(principal, annualRate, years) {
    if (principal <= 0 || annualRate <= 0 || years <= 0) return 0;
    const monthlyRate = annualRate / 100 / 12;
    const totalPayments = years * 12;
    const pmt = principal * (monthlyRate * Math.pow(1 + monthlyRate, totalPayments)) / (Math.pow(1 + monthlyRate, totalPayments) - 1);
    return pmt;
  }

  // 取得輸入值防錯 (NaN轉0)
  function getVal(id) {
    const val = parseFloat(document.getElementById(id).value);
    return isNaN(val) ? 0 : val;
  }

  function updateCalculations() {
    // 1. 信貸金額與月付金
    const creditAmount = getVal('creditAmount');
    const creditRate = getVal('creditRate');
    const creditYears = getVal('creditYears');
    const creditPay = calculatePMT(creditAmount, creditRate, creditYears);

    // 2. 保單貸款 (假設保貸為只還息不還本，或同攤還，這裡示範按月繳息)
    const policyAmount = getVal('policyAmount');
    const policyRate = getVal('policyRate');
    const policyPay = (policyAmount * (policyRate / 100)) / 12;

    // 總月付金
    const totalLoanPay = creditPay + policyPay;

    // 3. 投入市場資產計算
    let totalInvested = 0;
    if (document.getElementById('creditInvest').checked) totalInvested += creditAmount;
    if (document.getElementById('policyInvest').checked) totalInvested += policyAmount;
    if (document.getElementById('ownInvest').checked) totalInvested += getVal('ownAmount');

    // 4. 配息計算
    const yieldRate = getVal('yieldRate');
    const annualDiv = totalInvested * (yieldRate / 100);
    const monthlyDiv = annualDiv / 12;

    // 5. 淨現金流與覆蓋率
    const netMonthly = monthlyDiv - totalLoanPay;
    const netAnnual = annualDiv - (totalLoanPay * 12);
    const coverage = totalLoanPay > 0 ? (monthlyDiv / totalLoanPay) * 100 : 0;

    // 渲染 UI 畫面
    document.getElementById('totalAsset').innerText = `NT$ ${Math.round(totalInvested).toLocaleString()}`;
    document.getElementById('monthlyDividend').innerText = `+NT$ ${Math.round(monthlyDiv).toLocaleString()}`;
    document.getElementById('monthlyLoanPay').innerText = `-NT$ ${Math.round(totalLoanPay).toLocaleString()}`;
    document.getElementById('coverageRate').innerText = `${coverage.toFixed(1)}%`;
    
    // 每月淨現金流
    const netMonthlyEl = document.getElementById('netMonthlyFlow');
    netMonthlyEl.innerText = `${netMonthly >= 0 ? '+' : ''}NT$ ${Math.round(netMonthly).toLocaleString()}`;
    netMonthlyEl.className = `metric-value ${netMonthly >= 0 ? 'text-green' : 'text-red'}`;

    // 年度配息與淨現金流
    document.getElementById('annualDividend').innerText = `+NT$ ${Math.round(annualDiv).toLocaleString()}`;
    const netAnnualEl = document.getElementById('netAnnualFlow');
    netAnnualEl.innerText = `${netAnnual >= 0 ? '+' : ''}NT$ ${Math.round(netAnnual).toLocaleString()}`;
    netAnnualEl.className = `metric-value ${netAnnual >= 0 ? 'text-green' : 'text-red'}`;

    // 減壓評估 (覆蓋率達 100% 為達成)
    const stressEl = document.getElementById('stressStatus');
    if (coverage >= 100) {
      stressEl.innerText = "已達成";
      stressEl.style.color = "var(--green)";
    } else {
      stressEl.innerText = "未達成";
      stressEl.style.color = "var(--red)";
    }
  }

  // 自動監聽所有 input 與 checkbox 的變動
  document.querySelectorAll('input').forEach(input => {
    input.addEventListener('input', updateCalculations);
    input.addEventListener('change', updateCalculations);
  });

  // 初次載入計算
  updateCalculations();
</script>

</body>
</html>
