<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>套利試算器 - 槓桿試算與現金流規劃</title>
  <style>
    :root {
      --bg-main: #f9f6f0;
      --card-bg: #fdfbf7;
      --card-border: #ede8df;
      --text-dark: #2c2a29;
      --text-muted: #7d7871;
      --input-bg: #ffffff;
      --input-border: #e2ddd5;
      --accent-orange: #c06c47;
      --accent-orange-hover: #a85a38;
      
      --dashboard-bg: #363b4e;
      --dash-card-bg: #2d3142;
      --dash-text-light: #f1f2f6;
      --dash-text-muted: #9ba1b0;
      --green-text: #2ecc71;
      --red-text: #ff7675;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-dark);
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .calculator-container {
      max-width: 850px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Light Sections */
    .section-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-dark);
    }

    .toggle-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #dcd6cd;
      transition: .3s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent-orange);
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .form-grid:last-child {
      margin-bottom: 0;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .input-control {
      width: 100%;
      padding: 12px 16px;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      font-size: 1rem;
      color: var(--text-dark);
      outline: none;
      transition: border-color 0.2s;
    }

    .input-control:focus {
      border-color: var(--accent-orange);
    }

    /* Dark Dashboard Section */
    .dashboard-card {
      background-color: var(--dashboard-bg);
      border-radius: 16px;
      padding: 28px;
      color: var(--dash-text-light);
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .dash-header-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 24px;
      border-left: 4px solid var(--accent-orange);
      padding-left: 12px;
      color: var(--dash-text-light);
    }

    .dash-main-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    .dash-info-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .info-item .item-label {
      font-size: 0.9rem;
      color: var(--dash-text-muted);
      margin-bottom: 4px;
    }

    .info-item .item-value {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .info-item .item-value.green { color: var(--green-text); }
    .info-item .item-value.red { color: var(--red-text); }

    .coverage-card {
      background-color: var(--dash-card-bg);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-end;
      text-align: right;
    }

    .coverage-card .cov-label {
      font-size: 0.85rem;
      color: var(--dash-text-muted);
      margin-bottom: 12px;
    }

    .coverage-card .cov-sub-label {
      font-size: 0.8rem;
      color: var(--dash-text-muted);
      margin-top: 6px;
    }

    .coverage-card .cov-rate {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--red-text);
    }

    /* Sub Metrics Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .metric-box {
      background-color: var(--dash-card-bg);
      border-radius: 12px;
      padding: 16px 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .metric-box .m-title {
      font-size: 0.8rem;
      color: var(--dash-text-muted);
      margin-bottom: 10px;
    }

    .metric-box .m-val {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .metric-box .m-sub {
      font-size: 0.72rem;
      color: var(--dash-text-muted);
      margin-top: 4px;
    }

    @media (max-width: 680px) {
      .form-grid, .dash-main-grid {
        grid-template-columns: 1fr;
      }
      .metrics-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .coverage-card {
        align-items: flex-start;
        text-align: left;
      }
    }
  </style>
</head>
<body>

<div class="calculator-container">

  <!-- 1. 信用貸款 -->
  <div class="section-card">
    <div class="section-header">
      <div class="section-title">
        <span>☕</span> 信用貸款
      </div>
      <div class="toggle-container">
        <label class="switch">
          <input type="checkbox" id="creditInvest" checked>
          <span class="slider"></span>
        </label>
        投入市場
      </div>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>貸款銀行</label>
        <input type="text" class="input-control" value="line bank">
      </div>
      <div class="form-group">
        <label>信貸金額 (NT$)</label>
        <input type="number" id="creditAmount" class="input-control" value="1000000">
      </div>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>年利率 (%)</label>
        <input type="number" id="creditRate" class="input-control" step="0.1" value="4.8">
      </div>
      <div class="form-group">
        <label>年限 (年)</label>
        <input type="number" id="creditYears" class="input-control" value="10">
      </div>
    </div>
  </div>

  <!-- 2. 保單貸款 -->
  <div class="section-card">
    <div class="section-header">
      <div class="section-title">
        <span>📄</span> 保單貸款
      </div>
      <div class="toggle-container">
        <label class="switch">
          <input type="checkbox" id="policyInvest">
          <span class="slider"></span>
        </label>
        投入市場
      </div>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>保險公司名稱</label>
        <input type="text" class="input-control" value="公勝人壽">
      </div>
      <div class="form-group">
        <label>保貸金額 (NT$)</label>
        <input type="number" id="policyAmount" class="input-control" value="0">
      </div>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>利率 (%)</label>
        <input type="number" id="policyRate" class="input-control" step="0.1" placeholder="例如 4.0">
      </div>
      <div class="form-group">
        <!-- 預留結構 -->
      </div>
    </div>
  </div>

  <!-- 3. 自有資金與預估殖利率 -->
  <div class="section-card">
    <div class="section-header">
      <div class="section-title">
        <span>🐖</span> 自有資金
      </div>
      <div class="toggle-container">
        <label class="switch">
          <input type="checkbox" id="ownInvest" checked>
          <span class="slider"></span>
        </label>
        投入市場
      </div>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>自有現金金額 (NT$)</label>
        <input type="number" id="ownAmount" class="input-control" value="500000">
      </div>
      <div class="form-group">
        <label>預估投資年化配息率 (%)</label>
        <input type="number" id="yieldRate" class="input-control" step="0.1" value="8.8">
      </div>
    </div>
  </div>

  <!-- 4. 規劃成果總計 -->
  <div class="dashboard-card">
    <div class="dash-header-title">規劃成果總計</div>

    <div class="dash-main-grid">
      <div class="dash-info-group">
        <div class="info-item">
          <div class="item-label">總投入市場資產</div>
          <div class="item-value" id="totalAsset">NT$ 1,500,000</div>
        </div>
        <div class="info-item">
          <div class="item-label">每月預估現金流 <span style="font-size: 0.8rem; opacity: 0.7;">(配息)</span></div>
          <div class="item-value green" id="monthlyDividend">+NT$ 11,000</div>
        </div>
        <div class="info-item">
          <div class="item-label">每月貸款總支出 <span style="font-size: 0.8rem; opacity: 0.7;" id="periodLabel">(寬限期前/後)</span></div>
          <div class="item-value red" id="monthlyLoanPay">-NT$ 10,510</div>
        </div>
      </div>

      <div class="coverage-card">
        <div class="cov-label">配息覆蓋率 (配息 / 貸款支出)</div>
        <div class="cov-sub-label">寬限期前</div>
        <div class="cov-rate" id="coverageRate">104.7%</div>
        <div class="cov-sub-label">寬限期後</div>
        <div style="font-size: 1.2rem; font-weight: 700; color: var(--red-text);" id="coverageRateAfter">104.7%</div>
      </div>
    </div>

    <div class="metrics-grid">
      <div class="metric-box">
        <div class="m-title">每月淨現金流</div>
        <div class="m-val green" id="netMonthlyFlow">+NT$ 490</div>
        <div class="m-sub">(寬限期前/後)</div>
      </div>
      <div class="metric-box">
        <div class="m-title">財務減壓評估</div>
        <div class="m-val green" id="stressStatus">已達成</div>
        <div class="m-sub">(寬限期前/後)</div>
      </div>
      <div class="metric-box">
        <div class="m-title">年度配息總計</div>
        <div class="m-val green" id="annualDividend">+NT$ 132,000</div>
        <div class="m-sub">(預估年收)</div>
      </div>
      <div class="metric-box">
        <div class="m-title">年度淨現金流</div>
        <div class="m-val green" id="netAnnualFlow">+NT$ 5,880</div>
        <div class="m-sub">(寬限期前/後)</div>
      </div>
    </div>
  </div>

</div>

<script>
  // 標準等額本息公式 PMT
  function calculatePMT(principal, annualRate, years) {
    if (principal <= 0 || annualRate <= 0 || years <= 0) return 0;
    const monthlyRate = (annualRate / 100) / 12;
    const totalPayments = years * 12;
    const pmt = principal * (monthlyRate * Math.pow(1 + monthlyRate, totalPayments)) / (Math.pow(1 + monthlyRate, totalPayments) - 1);
    return pmt;
  }

  function getVal(id) {
    const val = parseFloat(document.getElementById(id).value);
    return isNaN(val) ? 0 : val;
  }

  function updateCalculations() {
    // 1. 信貸與保貸試算
    const creditAmount = getVal('creditAmount');
    const creditRate = getVal('creditRate');
    const creditYears = getVal('creditYears');
    const creditPay = calculatePMT(creditAmount, creditRate, creditYears);

    const policyAmount = getVal('policyAmount');
    const policyRate = getVal('policyRate');
    const policyPay = (policyAmount * (policyRate / 100)) / 12; // 保貸按月按息計算

    const totalLoanPay = creditPay + policyPay;

    // 2. 總投入金額計算
    let totalInvested = 0;
    if (document.getElementById('creditInvest').checked) totalInvested += creditAmount;
    if (document.getElementById('policyInvest').checked) totalInvested += policyAmount;
    if (document.getElementById('ownInvest').checked) totalInvested += getVal('ownAmount');

    // 3. 配息金額 (年化/每月)
    const yieldRate = getVal('yieldRate');
    const annualDiv = totalInvested * (yieldRate / 100);
    const monthlyDiv = annualDiv / 12;

    // 4. 淨現金流與覆蓋率
    const netMonthly = monthlyDiv - totalLoanPay;
    const netAnnual = annualDiv - (totalLoanPay * 12);
    const coverage = totalLoanPay > 0 ? (monthlyDiv / totalLoanPay) * 100 : 0;

    // 格式化數字
    const fmt = num => Math.round(num).toLocaleString();

    // 更新畫面
    document.getElementById('totalAsset').innerText = `NT$ ${fmt(totalInvested)}`;
    document.getElementById('monthlyDividend').innerText = `+NT$ ${fmt(monthlyDiv)}`;
    document.getElementById('monthlyLoanPay').innerText = `-NT$ ${fmt(totalLoanPay)}`;
    
    document.getElementById('coverageRate').innerText = `${coverage.toFixed(1)}%`;
    document.getElementById('coverageRateAfter').innerText = `${coverage.toFixed(1)}%`;

    const netMonthlyEl = document.getElementById('netMonthlyFlow');
    netMonthlyEl.innerText = `${netMonthly >= 0 ? '+' : ''}NT$ ${fmt(netMonthly)}`;
    netMonthlyEl.className = `m-val ${netMonthly >= 0 ? 'green' : 'red'}`;

    document.getElementById('annualDividend').innerText = `+NT$ ${fmt(annualDiv)}`;

    const netAnnualEl = document.getElementById('netAnnualFlow');
    netAnnualEl.innerText = `${netAnnual >= 0 ? '+' : ''}NT$ ${fmt(netAnnual)}`;
    netAnnualEl.className = `m-val ${netAnnual >= 0 ? 'green' : 'red'}`;

    const stressEl = document.getElementById('stressStatus');
    if (coverage >= 100) {
      stressEl.innerText = "已達成";
      stressEl.className = "m-val green";
    } else {
      stressEl.innerText = "未達成";
      stressEl.className = "m-val red";
    }
  }

  // 自動綁定 Event Listener
  document.querySelectorAll('input').forEach(input => {
    input.addEventListener('input', updateCalculations);
    input.addEventListener('change', updateCalculations);
  });

  // 初次執行
  updateCalculations();
</script>

</body>
</html>
